<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Course Lecture Player</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .player-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 90%; max-width: 1200px; text-align: center; }
        .slide-viewer { background: #eaeef3; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; border: 2px dashed #cbd5e1; overflow: hidden; }
        .slide-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .transcript-box { background: #f8fafc; padding: 15px; border-radius: 6px; min-height: 80px; text-align: left; border-left: 4px solid #0284c7; font-size: 16px; line-height: 1.6; margin-bottom: 25px; }
        .controls { display: flex; justify-content: space-between; gap: 10px; }
        button { padding: 12px 24px; font-size: 15px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .nav-btn { background: #0284c7; color: white; }
        .nav-btn:hover { background: #0369a1; }
        .repeat-btn { background: #64748b; color: white; }
        .repeat-btn:hover { background: #475569; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="player-container">
    <h2 id="lecture-title">Science Lecture Course Module</h2>
    <div class="slide-viewer" id="slide-display"></div>
    <div class="transcript-box" id="transcript-display"></div>
    <div class="controls">
        <button class="nav-btn" id="prev-btn" onclick="changeSlide(-1)">Previous Slide</button>
        <button class="repeat-btn" id="repeat-btn" onclick="repeatSlide()">🔁 Repeat Slide Audio</button>
        <button class="nav-btn" id="next-btn" onclick="changeSlide(1)">Next Slide</button>
    </div>
</div>
<script>

    {

    },
    {

    },
    {
        "slide_number": 4,
        "voiceover_script": "Now, imagine trying to count every single atom in a beaker. It's practically impossible because they're just too small. That\u2019s where the mole comes in. Think of it like a 'chemist's dozen.' Instead of counting individual particles one by one, we use Avogadro\u2019s number to bridge the gap. This clever trick allows us to simply weigh a sample on a scale to figure out exactly how many molecules are inside."
    },
    {
        "slide_number": 5,
        "voiceover_script": "Now, let's tackle one of the most important concepts in chemistry: the mole. I know the name sounds a bit strange, but think of it simply as a counting unit. You already use this logic every day. When you buy a dozen eggs, you know exactly how many you're getting\u2014twelve\u2014regardless of whether those eggs are jumbo or small. The mole works the exact same way; it's just a much larger 'dozen.'\\n\\nBecause atoms and molecules are so incredibly tiny, counting them one by one is impossible. That\u2019s where Avogadro\u2019s number comes in. One mole is equal to 6.022 times 10 to the 23rd power. That is a massive number\u2014a six followed by twenty-three zeros! It seems overwhelming, but this specific number is the magic bridge that allows us to take things we can't see, like individual atoms, and turn them into amounts we can actually weigh on a balance in the lab.\\n\\nThe best part is that this unit is universal. Whether you are counting single atoms, complex molecules, or charged ions, one mole always contains that same fixed number of particles. It\u2019s our standard way of keeping track of the invisible world."

    {

    },
    {
        "slide_number": 7,
        "voiceover_script": "Now, here is where the magic happens. In the lab, we can't actually count individual atoms or molecules because they're just too small. Instead, we use a scale to weigh things in grams. But chemistry happens in moles, not grams. This is where molar mass comes in. Think of molar mass as your bridge. It\u2019s the specific conversion factor that lets you translate the physical mass you measure on your balance into the actual number of particles you're working with. If you know the molar mass from the periodic table, you can cross that bridge in either direction. Whether you're starting with a pile of powder or a calculated amount of moles, this relationship is what allows us to accurately predict how much of a chemical we need for a reaction to work perfectly."
    },
    {
        "slide_number": 8,
        "voiceover_script": "Now, let's walk through how we actually calculate molar mass. Think of this as finding the total weight of a recipe. First, we head over to the periodic table to find the atomic mass for every single element in our compound. Once we have those numbers, we have to account for the quantity. If a formula has a subscript, like a two or a three, we simply multiply the atomic mass by that number. This ensures every single atom is counted in our final total. Finally, we add all those values together. The result is our molar mass, expressed in grams per mole. Now, here is the part that usually trips people up: why does the number on the periodic table, which is in atomic mass units, suddenly become grams? This is where Avogadro\u2019s number comes in. Because there are exactly 6.022 times ten to the twenty-third particles in one mole, the math works out perfectly so that the numerical value stays the same, but the scale shifts from a single atom to a macroscopic amount we can actually weigh on a balance in the lab. It\u2019s a beautiful bridge between the invisible world of atoms and the physical world we see."
    },
    {

    },
    {

    },
    {
        "slide_number": 11,
        "voiceover_script": "Now, let's put this into practice with a real example. Imagine we have 36 grams of water in a beaker. To figure out how many moles that actually is, we need to use that molar mass we just found\u2014about 18 grams per mole. Think of the molar mass as a conversion bridge; it tells us exactly how much one mole of water weighs. To cross that bridge, we simply divide our starting mass by the molar mass. When we divide 36 by 18.02, we get exactly 2.00 moles. It\u2019s a straightforward process: we take the physical weight we can measure on a scale and translate it into the chemical count that scientists use to track reactions. If you're following along, notice how the grams cancel out, leaving us with just the moles. Does that connection make sense to everyone?"
    },
    {
        "slide_number": 12,
        "voiceover_script": "Now that we understand the basics of chemical formulas, let's talk about how we actually use these substances in the lab. First, we have molarity. Think of this as the 'strength' of your solution. It tells us exactly how many moles of a solute are packed into one liter of liquid, which ensures our reactions are consistent every time. But before we can mix a solution, we need the right formula. You'll often start with an empirical formula, which is just the simplest, reduced ratio of atoms. However, nature usually builds molecules larger than that. To find the actual molecular formula, we simply scale that basic ratio up by a whole number to match the real-world molar mass of the substance. It's like moving from a simplified recipe to the full-sized version used in a professional kitchen."
    },
    {
        "slide_number": 13,
        "voiceover_script": "Now, let\u2019s talk about molarity. In simple terms, molarity is just a way to describe the concentration of a solution. Think of it like making a cup of coffee; some people like it weak, and some like it strong. In chemistry, we need a precise way to define that 'strength.' Molarity tells us exactly how many moles of a substance\u2014whether that's a molecule or an ion\u2014are dissolved in one single liter of liquid. To find this, we take the total moles of our solute and divide that by the total liters of the solution. The resulting unit is moles per liter, which we shorten to a capital M. You'll see this constantly in clinical settings. For example, when a nurse hangs an IV bag or a doctor reviews lab results, they aren't just looking at the total amount of a drug in the bag; they are looking at the molarity. This is crucial because it tells them the exact concentration entering the patient's bloodstream, regardless of whether the bag holds fifty milliliters or a full liter. It ensures the dosage is safe and consistent every single time, which is why mastering this calculation is so important for your future careers."
    },
    {
        "slide_number": 14,
        "voiceover_script": "Let\u2019s put this into practice with a real-world example using table salt, or sodium chloride. Imagine we take 58.5 grams of salt and dissolve it in enough water to reach a total volume of exactly one liter. Now, we can't just plug grams directly into our molarity formula; we have to speak the language of chemistry first, which means converting that mass into moles. Since the molar mass of salt is 58.5 grams per mole, our 58.5 grams equals exactly one mole of particles. Now the easy part: we take that one mole and divide it by our one liter of solution, giving us a final concentration of 1.00 Molar. You might be wondering why we bother with this extra conversion step instead of just using grams. Here is the key: chemical reactions don't happen based on how much a substance weighs, but on the actual number of atoms and molecules that collide. A gram of lead has far fewer atoms than a gram of salt. By using molarity, we ensure we are counting the actual particles involved in the reaction, which is the only way to get our stoichiometry right."
    },

        "slide_number": 15,

    {

    },
    {
        "slide_number": 17,

    },
    {
        "slide_number": 18,
        "voiceover_script": "Alright, let's take a breath and tie everything together. We've covered a lot of ground, but the big takeaway here is that the mole is our bridge. Since we can't possibly count individual atoms with our eyes, we use the mole to turn a massive number of particles into something we can actually measure on a scale. By using molar mass, you're essentially converting the weight of your sample into a count of molecules. Once we move those molecules into a liquid, we use molarity to describe exactly how crowded those particles are in a specific volume. We also learned how to use those ratios to scale an empirical formula up to a full molecular formula. Now, this is where the real magic happens. In our next topic, we're diving into stoichiometry. This is basically the recipe book of chemistry. We will learn how to predict exactly how much product we'll get from a reaction and how to calculate the percent yield to see how efficient our experiment actually was. If you're feeling a bit overwhelmed, don't worry\u2014that's normal. Just keep practicing those conversions, and I'll see you in the next module where we put these tools to work."
    }
];
    let currentIdx = 0;
    let currentAudio = new Audio();

    function updateUI() {
        const currentSlide = lectureData[currentIdx];
        document.getElementById('slide-display').innerHTML = `<img src="slides/Slide${currentSlide.slide_number}.png" alt="Slide ${currentSlide.slide_number}">`;
        document.getElementById('transcript-display').innerText = currentSlide.voiceover_script;
        document.getElementById('prev-btn').disabled = currentIdx === 0;
        document.getElementById('next-btn').disabled = currentIdx === lectureData.length - 1;
        playAudio(currentSlide.slide_number);
    }

    function playAudio(slideNum) {
        currentAudio.pause();
        currentAudio = new Audio(`audio/Slide${slideNum}.mp3`);
        currentAudio.play().catch(e => console.log("Autoplay blocked, waiting for user interaction."));
    }

    function changeSlide(direction) {
        currentIdx += direction;
        updateUI();
    }

    function repeatSlide() {
        currentAudio.currentTime = 0;
        currentAudio.play();
    }

    updateUI();
</script>
</body>
</html>
